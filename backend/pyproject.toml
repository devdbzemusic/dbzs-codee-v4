[project]
name = "dbzs-code-assistant-backend"
version = "0.4.0-rc.1"
description = "Local FastAPI backend for DBZS Code Assistant."
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.124.0",
    "pydantic>=2.12.0",
    "uvicorn[standard]>=0.38.0",
    "anthropic>=0.51.0",
    "openai>=1.60.0",
    "huggingface_hub>=0.33.0",
    "sse-starlette>=2.3.0",
    "psutil>=7.2.2",
    "pypdf>=6.1.3",
    "onnxruntime>=1.28.0",
    "tokenizers>=0.23.1",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pyinstaller==6.21.0",
    "pytest>=9.0.1"
]
antigravity = [
    "google-antigravity==0.1.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = [
    "ignore:Using `httpx` with `starlette.testclient` is deprecated:DeprecationWarning:starlette.testclient",
]
