# Required gates mirror: scripts/ci-local.sh / scripts/ci-local.ps1 (`pnpm ci:local`).
# Auto-triggers disabled: GitHub account billing lock (2026-07-23). Re-enable push/PR
# under `on:` after billing is resolved. Until then, run CI locally before merge.
name: CI

on:
  workflow_dispatch:

jobs:
  required-gates:
    name: Required gates
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
      fail-fast: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Setup uv
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Sync backend environment
        run: uv sync --frozen
        working-directory: backend

      - name: Repo health
        run: pnpm repo:health

      - name: Contract verification
        run: pnpm contracts:verify

      - name: Typecheck
        run: pnpm typecheck

      - name: Check versions
        run: pnpm check:version

      - name: Shared + desktop tests
        run: pnpm --filter @dbzs/shared test && pnpm --filter @dbzs/desktop test

      - name: Capability suite
        env:
          RUN_CAPABILITY_SUITE: "1"
        run: pnpm --filter @dbzs/desktop test:capabilities

      - name: Backend tests
        run: uv run pytest -q
        working-directory: backend

      - name: Build
        run: pnpm build

      - name: Packaging smoke
        run: pnpm smoke:packaging

      - name: Security regression tests
        run: pnpm --filter @dbzs/desktop exec vitest run electron/workspacePathGuard.test.ts electron/commandExecutionService.test.ts

      - name: Backend smoke
        run: pnpm smoke:backend

      - name: Backend doctor
        run: pnpm doctor:backend

      - name: Dependency audit
        run: pnpm audit --prod --audit-level moderate

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-reports-${{ matrix.os }}-${{ github.run_id }}
          path: |
            apps/desktop/playwright-report/
            backend/.pytest_cache/
          retention-days: 7

  e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest
    needs: required-gates
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Setup uv
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Sync backend environment
        run: uv sync --frozen
        working-directory: backend

      - name: Install Playwright browsers
        working-directory: apps/desktop
        run: pnpm exec playwright install --with-deps chromium

      - name: Run E2E tests
        working-directory: apps/desktop
        run: pnpm run e2e

      - name: Upload E2E artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report-${{ github.run_id }}
          path: |
            apps/desktop/playwright-report/
            apps/desktop/test-results/
            apps/desktop/electron-stderr.log
          retention-days: 7
