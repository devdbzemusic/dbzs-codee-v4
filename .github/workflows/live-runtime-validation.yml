name: Live Runtime Validation

on:
  workflow_dispatch:

jobs:
  live-runtime:
    runs-on: [self-hosted, windows, x64, dbzs-runtime]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: astral-sh/setup-uv@v5
      - run: pnpm install --frozen-lockfile
      - run: uv sync --frozen
        working-directory: backend
      - name: Gate boot-core
        run: pnpm smoke-test

      - name: Gate runtime-readiness
        run: pnpm acceptance:live

      - name: Gate fallback-path
        run: cd backend && uv run pytest tests/test_runtime_warmup.py tests/test_runtime_service.py -q

      - name: Gate review-path-smoke
        run: pnpm --filter @dbzs/desktop exec vitest run src/services/runtimeChat/reviewRemediationPhase.test.ts

      - name: Gate antigravity-optional
        if: ${{ env.GEMINI_API_KEY != '' }}
        run: uv run --group antigravity pytest tests/test_antigravity_service.py -q
        working-directory: backend
