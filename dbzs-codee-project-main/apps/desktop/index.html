<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' http://127.0.0.1:8876 http://localhost:* ws://localhost:* ws://127.0.0.1:*; worker-src 'self' blob:"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DBZS Code Assistant</title>
  </head>
  <body>
    <div id="root"></div>
    <div
      id="dbzs-boot-splash"
      style="
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: grid;
        place-items: center;
        background: #070b10;
        color: #e8f0f7;
        font-family: Inter, ui-sans-serif, system-ui, sans-serif;
      "
    >
      <div style="text-align: center">
        <div
          style="
            margin: 0 auto 1rem;
            width: 2rem;
            height: 2rem;
            border: 2px solid rgba(33, 214, 199, 0.25);
            border-top-color: #21d6c7;
            border-radius: 9999px;
            animation: dbzs-spin 0.8s linear infinite;
          "
        ></div>
        <p style="margin: 0; font-size: 0.875rem; color: #89a1b4">DBZS Code Assistant wird geladen …</p>
      </div>
    </div>
    <style>
      @keyframes dbzs-spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
