schemaVersion: "1.0"
id: workspace
kind: skill
name: Workspace Scan
version: 1.0.0
description: Struktur und Einstiegspunkte des aktiven Workspace analysieren
mode: advisory
targetAgents: [runtime_chat]
activation: { intents: [workspace_analysis], keywords: [workspace, repository, struktur], explicitOnly: false, autoSuggest: true }
preconditions:
  - { id: workspace, description: Aktiver Workspace, required: true, evaluator: has_active_workspace }
effects: [workspace_summary]
domains: [software-development]
cost: low
latency: fast
riskLevel: low
sideEffects: []
idempotent: true
permissions:
  allowedTools: [list_files, read_file, search_workspace, grep, ask_user, write_skill_artifact]
  requiredTools: [list_files]
  mayReadFiles: true
  mayWriteFiles: false
  mayRunCommands: false
  mayInstallDependencies: false
  mayUseNetwork: false
compatibility: { requires: [], conflictsWith: [], composesWith: [], enables: [] }
successSignals: [{ id: entrypoints, description: Relevante Einstiegspunkte sind benannt, required: true }]
failureSignals: [{ id: ungrounded_summary, description: Zusammenfassung ohne Workspace-Evidenz }]
observability: { logs: [workspace scan completed], metrics: [file_count] }
