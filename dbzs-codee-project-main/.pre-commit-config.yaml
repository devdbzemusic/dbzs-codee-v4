repos:
  - repo: local
    hooks:
      - id: typecheck
        name: TypeScript Typecheck
        entry: pnpm typecheck
        language: system
        pass_filenames: false
        always_run: true
        stages: [commit]

      - id: test
        name: Tests (Shared + Desktop)
        entry: pnpm --filter @dbzs/shared test && pnpm --filter @dbzs/desktop test
        language: system
        pass_filenames: false
        always_run: true
        stages: [commit]

      - id: black
        name: Python Format (Black)
        entry: black
        language: python
        types: [python]
        args: [--quiet]

      - id: isort
        name: Python Imports (isort)
        entry: isort
        language: python
        types: [python]
        args: [--quiet]
