name: Release

on:
  push:
    tags: ["v*-rc.*"]

permissions:
  contents: write

jobs:
  windows-release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v5
      - run: pnpm install --frozen-lockfile
      - run: uv sync --frozen --group dev
        working-directory: backend
      - run: pnpm check:version
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: Packaging smoke
        run: pnpm smoke:packaging
      - name: Dependency audit
        run: pnpm audit --prod --audit-level moderate
      - name: Smoke test
        run: pnpm smoke-test
      - name: Windows installer and portable build
        run: pnpm --filter @dbzs/desktop release:win
      - name: Create checksums
        shell: pwsh
        run: Get-FileHash apps/desktop/dist-release/* -Algorithm SHA256 | Format-Table -AutoSize | Out-File apps/desktop/dist-release/SHA256SUMS.txt
      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dbzs-codee-${{ github.ref_name }}-windows-x64
          path: apps/desktop/dist-release/*
