# DBZS Codee — Entwicklungsumgebung

**Docker-Compose für reproduzierbare Development-Umgebung**

## Voraussetzungen

- Docker Desktop installiert
- Docker Compose v2+

## Quickstart

```bash
# Umgebung starten
docker-compose -f docker-compose.dev.yml up -d

# Logs anzeigen
docker-compose -f docker-compose.dev.yml logs -f

# Umgebung stoppen
docker-compose -f docker-compose.dev.yml down
```

## Services

### Backend

- **Port:** 8876
- **Volume:** `./backend:/app` (live reload)
- **Health:** http://localhost:8876/health

### Ollama (Optional)

- **Port:** 11434
- **Models:** Persist in `~/.ollama/models`
- **UI:** http://localhost:11434

## Entwicklung

### Backend im Container

```bash
# In Container shellen
docker-compose -f docker-compose.dev.yml exec backend bash

# Tests laufen
docker-compose -f docker-compose.dev.yml exec backend uv run pytest

# Typecheck
docker-compose -f docker-compose.dev.yml exec backend python -m mypy app/
```

### Desktop (lokal)

Desktop-App läuft weiterhin lokal auf deinem Rechner:

```bash
pnpm dev
```

Backend-URL bleibt `http://127.0.0.1:8876`.

## Umgebungsvariablen

```yaml
# In docker-compose.dev.yml
services:
  backend:
    environment:
      - DBZS_BACKEND_PORT=8876
      - DBZS_MODELS_DIR=/models
      - DBZS_OLLAMA_BASE_URL=http://ollama:11434
```

## Persistenz

Folgende Daten werden persistiert:

- Ollama-Modelle: `~/.ollama/models`
- Backend-DBs: `./backend/data/*.db`
- Logs: `./backend/logs/`

## Cleanup

```bash
# Alles löschen (inkl. Volumes!)
docker-compose -f docker-compose.dev.yml down -v

# Nur Container stoppen
docker-compose -f docker-compose.dev.yml down
```

## Troubleshooting

**Problem:** Port bereits belegt

```bash
# Port prüfen
netstat -ano | findstr :8876

# Anderen Port verwenden
docker-compose -f docker-compose.dev.yml up --env DBZS_BACKEND_PORT=8877
```

**Problem:** Volume-Permissions

```bash
# Ownership fixen (Linux/Mac)
sudo chown -R $(id -u):$(id -g) ./backend/data
```

