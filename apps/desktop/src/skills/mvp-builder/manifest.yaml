schemaVersion: "1.0"
id: mvp-builder
kind: skill
name: MVP Builder
version: 1.0.0
description: Rapid MVP development and feature prioritization for fast product validation
mode: planning
targetAgents: [planner]
activation:
  intents: [product_planning, feature_prioritization, mvp_definition]
  keywords: [mvp, minimum viable product, priorisieren, validieren]
  explicitOnly: false
  autoSuggest: true
preconditions:
  - { id: product-idea, description: Klare Produktidee oder Feature-Anfrage, required: true, evaluator: has_product_idea }
effects: [mvp_scope, feature_matrix, validation_plan, assumptions]
domains: [product-development, mvp, validation, prioritization]
cost: low
latency: fast
riskLevel: low
sideEffects: [creates_skill_artifacts, defines_scope]
idempotent: true
permissions:
  allowedTools: [list_files, read_file, search_workspace, ask_user, write_skill_artifact]
  requiredTools: [ask_user, write_skill_artifact]
  mayReadFiles: true
  mayWriteFiles: false
  mayRunCommands: false
  mayInstallDependencies: false
  mayUseNetwork: false
compatibility:
  requires: []
  conflictsWith: [feature-complete-mentality, premature-optimization]
  composesWith: []
  enables: [fast-validation, lean-development]
successSignals:
  - { id: riskiest_assumption, description: Riskanteste Annahme ist identifiziert, required: true }
  - { id: mvp_pattern, description: MVP-Muster ist gewählt, required: true }
  - { id: feature_priorities, description: Features sind P0/P1/P2/Out of Scope zugeordnet, required: true }
  - { id: validation_metrics, description: Validierungsmetriken sind definiert, required: true }
  - { id: success_criteria, description: Erfolgskriterien sind definiert, required: true }
failureSignals:
  - { id: p0_too_large, description: P0 ist für ein MVP zu groß }
  - { id: missing_metrics, description: Keine Validierungsmetriken }
  - { id: missing_assumption, description: Keine riskanteste Annahme }
observability:
  logs: [MVP pattern selected, MVP scope completed]
  metrics: [p0_feature_count, skill_artifact_count]
metadata:
  createdAt: "2025-10-29"
  tags: [mvp, lean-startup, prioritization, validation]
  examples: [Build task management MVP in one week]
