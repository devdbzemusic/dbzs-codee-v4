schemaVersion: "1.0"
id: implement
kind: skill
name: Implementierung
version: 1.0.0
description: Kleine, testbare Codeänderungen implementieren
mode: execution
targetAgents: [coder]
activation: { intents: [implementation, code_change], keywords: [implementiere, ändere, code], explicitOnly: true, autoSuggest: false }
preconditions:
  - { id: workspace, description: Aktiver Workspace, required: true, evaluator: has_active_workspace }
effects: [code_change]
domains: [software-development]
cost: medium
latency: normal
riskLevel: medium
sideEffects: [project_file_changes]
idempotent: false
permissions:
  allowedTools: [list_files, read_file, search_workspace, grep, propose_file_changes, ask_user]
  requiredTools: [read_file, propose_file_changes]
  mayReadFiles: true
  mayWriteFiles: true
  mayRunCommands: false
  mayInstallDependencies: false
  mayUseNetwork: false
compatibility: { requires: [], conflictsWith: [], composesWith: [], enables: [] }
successSignals: [{ id: change_verified, description: Änderung ist geprüft und nachvollziehbar, required: true }]
failureSignals: [{ id: unverified_change, description: Änderung ohne Verifikation }]
observability: { logs: [implementation completed], metrics: [changed_file_count] }
