appId: de.dbzs.codee
productName: DBZS Code Assistant
appVersion: 0.4.0-rc.1
copyright: Copyright © 2026 DBZS

directories:
  output: dist-release
  buildResources: build

files:
  - out/**/*
  - package.json

extraResources:
  - from: ../../backend-dist/
    to: backend
    filter:
      - "**/*"

# Verhindert automatische Updates aus externen Quellen
asar: true

win:
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64
  icon: build/icon.ico
  signAndEditExecutable: false

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  installerHeaderIcon: build/icon.ico
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: DBZS Code Assistant
  license: null

mac:
  target:
    - target: dmg
      arch:
        - x64
        - arm64
  icon: build/icon.icns
  category: public.app-category.developer-tools

linux:
  target:
    - target: AppImage
      arch:
        - x64
  icon: build/icon.png
  category: Development
