appId: de.dbzs.codee
productName: DBZS Code Assistant
appVersion: 0.4.0-rc.1
copyright: Copyright © 2026 DBZS

directories:
  output: dist-release
  buildResources: build

files:
  - out/**/*
  - package.json

extraResources:
  - from: ../../backend-dist/
    to: backend
    filter:
      - "**/*"

# Verhindert automatische Updates aus externen Quellen
asar: true

# Code-signing: no certificate exists yet, so builds are deliberately unsigned.
# electron-builder auto-detects CSC_LINK/CSC_KEY_PASSWORD env vars once a real
# certificate is available -- no config change needed here to activate it,
# only `signAndEditExecutable: false` below and `forceCodeSigning` (unset,
# defaults to false) need revisiting. See HANDOVER.md "Code-Signing" for the
# checklist to run through once a certificate is purchased.
win:
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64
  icon: build/icon.ico
  signAndEditExecutable: false

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  installerHeaderIcon: build/icon.ico
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: DBZS Code Assistant
  license: null

# Same as win: unsigned/un-notarized until an Apple Developer ID certificate
# exists. electron-builder reads CSC_LINK/CSC_KEY_PASSWORD (signing) and
# APPLE_ID/APPLE_APP_SPECIFIC_PASSWORD/APPLE_TEAM_ID (notarization via
# @electron/notarize, auto-invoked when those are set) from the environment —
# no yml change needed to activate once a certificate is available.
mac:
  target:
    - target: dmg
      arch:
        - x64
        - arm64
  icon: build/icon.icns
  category: public.app-category.developer-tools

linux:
  target:
    - target: AppImage
      arch:
        - x64
  icon: build/icon.png
  category: Development
